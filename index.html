<title>YOU HQ</title><style>body{margin:0;background:#F7F5F1;color:#1F1E1D;font:16px -apple-system,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 16px) 16px 48px}
header{display:flex;gap:12px;align-items:center;margin:4px 2px 14px}header img{width:46px;height:46px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{margin:0;font-size:24px;font-weight:600;letter-spacing:.02em}h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:#8C877F;margin:0 0 14px;font-weight:600}h3{font-size:13px;color:#8C877F;font-weight:600;margin:18px 0 8px}
section{background:#fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 1px 2px rgba(31,30,29,.04),0 6px 20px rgba(31,30,29,.04)}
.hero .hv{font-size:44px;font-weight:600;color:#B5704F;letter-spacing:-.02em}.hero .hv span{font-size:18px;color:#8C877F}
.g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}.k{background:#F7F5F1;border-radius:16px;padding:12px;min-width:0;overflow-wrap:anywhere}summary{color:#5E8A6E;font-weight:600;cursor:pointer}
.kl{font-size:12px;color:#8C877F}.kv{font-size:28px;font-weight:600;margin-top:4px;letter-spacing:-.01em}.ks{font-size:12px;color:#8C877F;margin-top:3px}
.red{color:#B5704F}.ok{color:#5E8A6E}.amber{color:#B8893B}.na{color:#B8893B;font-size:16px;font-weight:600}
.nck{background:#FBF7EF;border:1px dashed #E5D9C3}.how{font-size:11px;color:#6F6A62;margin-top:8px;line-height:1.4}
.warn{color:#B5704F;font-size:13px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid #EEEAE3;text-align:left;font-weight:normal}th{color:#8C877F;font-size:12px}
small{color:#8C877F}.src{font-size:11px;color:#A9A49B;margin-top:12px}.rev{padding:9px 0;border-bottom:1px solid #EEEAE3;font-size:14px}.rev b{color:#C9A35B}
ol{padding-left:20px}li{margin:9px 0}#lock{text-align:center;margin-top:30vh;color:#8C877F}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:16px}.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:#8C877F}
.bar div{width:100%;background:#A9BFAE;border-radius:6px 6px 2px 2px;min-height:2px}.bar span{order:-1;margin-bottom:2px;color:#1F1E1D}#pin{text-align:center;margin-top:10vh}#pin h1{margin:10px 0 4px}#dots{display:flex;gap:16px;justify-content:center;margin:26px 0}#dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #1F1E1D}#dots i.f{background:#1F1E1D}
#pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px;justify-content:center}#pad button{height:76px;border-radius:50%;border:0;background:#fff;font-size:28px;color:#1F1E1D;box-shadow:0 1px 4px rgba(0,0,0,.08);-webkit-tap-highlight-color:transparent}#pad button:active{background:#EEEAE3}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.links{display:flex;gap:18px;justify-content:center;margin:22px 0 6px}.links a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#8C877F;font-size:11px}.ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}.ic.hs{background:#FF7A59}

const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
const app=document.getElementById('app');
async function tryKey(raw){try{const d=b64(P),key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
const t=await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},key,d.slice(12));app.innerHTML=new TextDecoder().decode(t);return true}catch(e){return false}}
async function derive(pin,salt){const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:200000},bk,256))}
const enc=u=>btoa(String.fromCharCode(...u));
(async()=>{const hk=new URLSearchParams(location.hash.slice(1)).get('k')||new URLSearchParams(location.search).get('k');if(hk)localStorage.setItem('youk',hk);

const dk=localStorage.getItem('youdk');if(dk&&await tryKey(b64(dk)))return;

['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(c=>{const x=document.createElement('button');x.textContent=c;if(!c)x.style.visibility='hidden';

if(v.length===4){const raw=await derive(v,b64(k));if(await tryKey(raw)){localStorage.setItem('youdk',enc(raw))}else{const d=document.getElementById('dots');d.className='shake';setTimeout(()=>{d.className='';v='';draw()},400)}}};pad.appendChild(x)});})();
